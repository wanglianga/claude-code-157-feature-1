# 一键启动: docker compose up -d --build
# 启动后: 陪护证服务 http://localhost:8080, PostgreSQL :55432
# 需要真实 Kafka 时: docker compose --profile kafka up -d
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: escort
      POSTGRES_USER: escort
      POSTGRES_PASSWORD: escort
    ports:
      - "55432:5432"
    volumes:
      - escort-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escort -d escort"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: escort-pass-service:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/escort
      DB_USER: escort
      DB_PASSWORD: escort
      ESCORT_KAFKA_ENABLED: "false"
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    profiles: ["kafka"]
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    ports:
      - "9092:9092"

volumes:
  escort-pg:
