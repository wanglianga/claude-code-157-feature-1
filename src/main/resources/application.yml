server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: escort-pass-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/escort}
    username: ${DB_USER:escort}
    password: ${DB_PASSWORD:escort}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: escort-pass-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

escort:
  kafka:
    # true  -> 通过 Kafka 发布领域事件并由消费者回执门禁同步
    # false -> 本地模式: 事件仅落日志, 门禁同步由本地模拟器完成
    enabled: ${ESCORT_KAFKA_ENABLED:false}
  zone-id: ${ESCORT_ZONE_ID:Asia/Shanghai}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
    com.hospital.escort: info
